<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plus Medico Delivery</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1769AA">

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f2f5f9;
  color:#222;
}

header{
  background:#1769aa;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:24px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:15px;
}

.stat{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 2px 8px #ddd;
}

.stat span{
  display:block;
  font-size:14px;
}

.stat b{
  display:block;
  font-size:22px;
  margin-top:5px;
}

.card{
  background:white;
  padding:18px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #ddd;
}

label{
  display:block;
  font-weight:bold;
  margin-top:10px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:80px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 15px;
  cursor:pointer;
  font-size:15px;
}

.save{
  width:100%;
  margin-top:15px;
  background:#1769aa;
  color:white;
  font-size:17px;
}

.changeBox{
  margin-top:12px;
  padding:12px;
  background:#eef7ff;
  border-radius:8px;
}

.balanceBox{
  margin-top:8px;
  padding:12px;
  background:#fff3cd;
  border-radius:8px;
}

.collectBox{
  margin-top:10px;
  padding:12px;
  background:#e8f7ee;
  border-radius:8px;
}

.search{
  margin-bottom:15px;
}

.delivery{
  border-top:1px solid #ddd;
  padding:15px 0;
}

.delivery h3{
  margin-top:0;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.call{
  background:#25d366;
  color:white;
}

.map{
  background:#4285f4;
  color:white;
}

.done{
  background:#198754;
  color:white;
}

.collect{
  background:#ff9800;
  color:white;
}

.delete{
  background:#dc3545;
  color:white;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:6px;
  font-size:13px;
  background:#eee;
}

.summary{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #ddd;
}

.summary h3{
  margin-top:0;
}

.summaryRow{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid #eee;
}

.loading{
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <h1>🚚 Plus Medico Delivery</h1>
</header>

<div class="container">

  <!-- DASHBOARD -->

  <div class="stats">

    <div class="stat">
      <span>📦 Total Deliveries</span>
      <b id="count">0</b>
    </div>

    <div class="stat">
      <span>💰 Total Amount</span>
      <b id="total">₹0</b>
    </div>

    <div class="stat">
      <span>✅ Paid</span>
      <b id="paid">₹0</b>
    </div>

    <div class="stat">
      <span>⚠️ Unpaid</span>
      <b id="unpaid">₹0</b>
    </div>

  </div>


  <!-- PAYMENT SUMMARY -->

  <div class="summary">

    <h3>💳 Payment Summary</h3>

    <div class="summaryRow">
      <span>💵 Cash</span>
      <b id="cashTotal">₹0</b>
    </div>

    <div class="summaryRow">
      <span>📱 Online</span>
      <b id="onlineTotal">₹0</b>
    </div>

    <div class="summaryRow">
      <span>📒 Credit</span>
      <b id="creditTotal">₹0</b>
    </div>

  </div>


  <!-- NEW DELIVERY -->

  <div class="card">

    <h2>➕ New Delivery</h2>

    <label>Delivery Boy Name</label>
    <input id="boy" placeholder="Delivery boy name">

    <label>Customer Name</label>
    <input id="customer" placeholder="Customer name">

    <label>Customer Mobile</label>
    <input id="mobile" type="tel" placeholder="Mobile number">

    <label>Customer Address</label>
    <textarea id="address" placeholder="Customer address"></textarea>

    <label>Order Amount</label>
    <input
      id="order"
      type="number"
      placeholder="₹ Order amount"
      oninput="calculateMoney()"
    >

    <label>Customer Se Received Amount</label>
    <input
      id="received"
      type="number"
      placeholder="₹ Received amount"
      oninput="calculateMoney()"
    >

    <div class="changeBox">
      🔄 Change to Give:
      <b id="change">₹0</b>
    </div>

    <div class="balanceBox">
      ⚠️ Balance / Unpaid:
      <b id="balance">₹0</b>
    </div>


    <label>Payment Type</label>

    <select id="paymentType">

      <option value="Cash">
        💵 Cash
      </option>

      <option value="Online">
        📱 Online
      </option>

      <option value="Credit">
        📒 Credit
      </option>

    </select>


    <label>Payment Status</label>

    <select id="payment">

      <option value="Unpaid">
        Unpaid
      </option>

      <option value="Paid">
        Paid
      </option>

    </select>


    <label>Delivery Status</label>

    <select id="status">

      <option value="Pending">
        Pending
      </option>

      <option value="Out for Delivery">
        Out for Delivery
      </option>

      <option value="Delivered">
        Delivered
      </option>

      <option value="Cancelled">
        Cancelled
      </option>

    </select>


    <button
      class="save"
      onclick="saveDelivery()"
    >

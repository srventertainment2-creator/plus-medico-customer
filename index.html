<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLUS MEDICO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4fbfa;
      color: #123;
    }

    header {
      background: #087f73;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
    }

    .top {
      background: white;
      padding: 15px;
      text-align: center;
    }

    .top a {
      display: inline-block;
      margin: 5px;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }

    .call {
      background: #087f73;
    }

    .whatsapp {
      background: #159447;
    }

    .search {
      padding: 15px;
      background: white;
    }

    .search input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .shop {
      text-align: center;
      padding: 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      padding: 15px;
      max-width: 1100px;
      margin: auto;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .product img {
      width: 100%;
      height: 170px;
      object-fit: contain;
      border-radius: 8px;
      background: #f5f5f5;
    }

    .product h3 {
      margin-bottom: 5px;
    }

    .category {
      color: #087f73;
      font-size: 14px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin: 10px 0;
    }

    .stock {
      color: #168a45;
      font-weight: bold;
    }

    .order {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: #159447;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

      padding: 20px;

      color: white;
      text-align: center;


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLUS MEDICO</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4fbfa;color:#123}
header{background:#087f73;color:white;text-align:center;padding:22px}
header h1{margin:0;font-size:28px}
header p{margin:7px 0 0}
.info{text-align:center;background:white;padding:18px}
.buttons{text-align:center;padding:10px;background:white}
.btn{display:inline-block;padding:12px 20px;margin:5px;border-radius:8px;color:white;text-decoration:none;font-weight:bold}
.call{background:#087f73}
.whatsapp{background:#159447}
.search{padding:15px;background:white}
.search input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:16px}
.products{padding:15px;max-width:1100px;margin:auto}
.product{background:white;padding:18px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #ddd}
.product h2{margin:5px 0}
.category{color:#087f73}
.price{font-size:22px;font-weight:bold;margin:10px 0}
.stock{color:#168a45;font-weight:bold}
.order{display:block;text-align:center;background:#159447;color:white;padding:12px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:12px}
footer{background:#087f73;color:white;text-align:center;padding:20px;margin-top:25px}
</style>
</head>

<body>

<header>
<h1>PLUS MEDICO</h1>
<p>Your Trusted Medical Store</p>
</header>

<div class="buttons">
<a class="btn call" href="tel:+917448662222">📞 Call</a>
<a class="btn whatsapp" href="https://wa.me/917448662222" target="_blank">💬 WhatsApp</a>
</div>

<div class="info">
<strong>PLUS MEDICO</strong>
<p>Lulla Nagar, Kubera Park, Kondhwa, Pune</p>
<p>📞 7448 66 2222</p>
<p>✅ Genuine Products &nbsp; 🚚 Home Delivery &nbsp; 🟢 Open Daily</p>
</div>

<div class="search">
<input id="search" type="search" placeholder="Search medicines, vitamins, devices...">
</div>

<div class="products" id="products">
<div class="product">
<h2>Loading products...</h2>
<p>Please wait.</p>
</div>
</div>

<footer>
PLUS MEDICO<br>
Lulla Nagar, Kubera Park, Kondhwa, Pune<br>
📞 7448 66 2222
</footer>

<script>
const SUPABASE_URL="https://qoxigoihzffmdmdflwnm.supabase.co";

/*
  Temporary demo product.
  We will connect your existing Supabase products
  in the next step.
*/

let products=[
{
name:"Dolo 650",
category:"Allopathic",
price:"30",
stock:"In Stock"
}
];

const box=document.getElementById("products");
const search=document.getElementById("search");

function showProducts(list){
if(!list.length){
box.innerHTML='<div class="product"><h2>No products found</h2></div>';
return;
}

box.innerHTML=list.map(p=>`
<div class="product">
<h2>${p.name}</h2>
<div class="category">${p.category}</div>
<div class="price">₹${p.price}</div>
<div class="stock">● ${p.stock}</div>
<a class="order"
href="https://wa.me/917448662222?text=${encodeURIComponent("Hello PLUS MEDICO, I want to order "+p.name+" - ₹"+p.price)}"
target="_blank">
💬 WhatsApp Order
</a>
</div>
`).join("");
}

search.addEventListener("input",()=>{
const q=search.value.toLowerCase();
showProducts(products.filter(p=>p.name.toLowerCase().includes(q)));
});

showProducts(products);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plus Medico Delivery</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f6fa;color:#222}
header{background:#1769aa;color:#fff;padding:18px;text-align:center}
header h1{margin:0;font-size:24px}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:#fff;padding:18px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #ddd}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}
.stat{background:#fff;padding:15px;border-radius:10px;text-align:center;box-shadow:0 2px 8px #ddd}
.stat b{display:block;font-size:21px;margin-top:5px}
label{font-weight:bold;display:block;margin-top:10px}
input,textarea,select{width:100%;padding:12px;margin-top:5px;border:1px solid #ccc;border-radius:8px;font-size:16px}
textarea{min-height:80px}
button{border:0;border-radius:8px;padding:12px 15px;cursor:pointer}
.save{width:100%;background:#1769aa;color:#fff;margin-top:15px;font-size:17px}
.change{background:#eef7ff;padding:12px;margin-top:10px;border-radius:8px}
.delivery{border-top:1px solid #ddd;padding-top:15px;margin-top:15px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.call{background:#25d366;color:white}
.map{background:#4285f4;color:white}
.done{background:#198754;color:white}
.delete{background:#dc3545;color:white}
</style>
</head>

<body>

<header>
<h1>🚚 Plus Medico Delivery</h1>
</header>

<div class="container">

<div class="stats">
<div class="stat">Total Deliveries<b id="count">0</b></div>
<div class="stat">Total Amount<b id="total">₹0</b></div>
<div class="stat">Paid<b id="paid">₹0</b></div>
<div class="stat">Unpaid<b id="unpaid">₹0</b></div>
</div>

<div class="card">

<h2>➕ New Delivery</h2>

<label>Delivery Boy Name</label>
<input id="boy" placeholder="Delivery boy name">

<label>Customer Name</label>
<input id="customer" placeholder="Customer name">

<label>Customer Mobile</label>
<input id="mobile" type="tel" placeholder="Mobile number">

<label>Customer Address</label>
<textarea id="address" placeholder="Customer address"></textarea>

<label>Order Amount</label>
<input id="order" type="number" placeholder="₹ Order amount" oninput="calculate()">

<label>Customer Se Received Amount</label>
<input id="received" type="number" placeholder="₹ Received amount" oninput="calculate()">

<div class="change">
🔄 Change to Give:
<b id="change">₹0</b>
</div>

<label>Payment</label>
<select id="payment">
<option value="Unpaid">Unpaid</option>
<option value="Paid">Paid</option>
</select>

<label>Delivery Status</label>
<select id="status">

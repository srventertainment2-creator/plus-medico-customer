<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plus Medico Delivery</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f5f9;
}
header{
  background:#1769aa;
  color:white;
  padding:18px;
  text-align:center;
}
.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}
.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 2px 8px #ddd;
}
label{
  display:block;
  font-weight:bold;
  margin-top:12px;
}
input,textarea,select{
  width:100%;
  padding:12px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
  font-size:16px;
}
textarea{
  height:80px;
}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:8px;
  background:#1769aa;
  color:white;
  font-size:17px;
}
.delivery{
  border-top:1px solid #ddd;
  padding:15px 0;
}
</style>
</head>

<body>

<header>
<h1>🚚 Plus Medico Delivery</h1>
</header>

<div class="container">

<div class="card">

<h2>➕ New Delivery</h2>

<label>Delivery Boy Name</label>
<input id="boy" placeholder="Delivery boy name">

<label>Customer Name</label>
<input id="customer" placeholder="Customer name">

<label>Customer Mobile</label>
<input id="mobile" placeholder="Mobile number">

<label>Customer Address</label>
<textarea id="address" placeholder="Customer address"></textarea>

<label>Order Amount</label>
<input id="order" type="number" placeholder="₹ Order amount">

<label>Received Amount</label>
<input id="received" type="number" placeholder="₹ Received amount">

<label>Payment</label>
<select id="payment">
<option value="Unpaid">Unpaid</option>
<option value="Paid">Paid</option>
</select>

<label>Delivery Status</label>
<select id="status">
<option value="Pending">Pending</option>
<option value="Out for Delivery">Out for Delivery</option>
<option value="Delivered">Delivered</option>
</select>

<button onclick="saveDelivery()">💾 Save Delivery</button>

</div>

<div class="card">

<h2>📦 Delivery List</h2>

<div id="list">Loading...</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://rnqxgovsabngikhvbeal.supabase.co";

const SUPABASE_KEY =
"sb_publishable_a8jbA7w9mCgHhM_6Q_bCRQ_CXUss_5b";


async function loadDeliveries(){

try{

const response = await fetch(
SUPABASE_URL +
"/rest/v1/deliveries?select=*",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
}
);

const data = await response.json();

console.log(data);

if(!response.ok){

document.getElementById("list").innerHTML =
"❌ "+JSON.stringify(data);

return;
}

if(data.length===0){

document.getElementById("list").innerHTML =
"No deliveries yet.";

return;
}

let html="";

data.forEach(function(d){

html += `
<div class="delivery">

<b>👨‍✈️ Delivery Boy:</b>
${d.delivery_boy_name || ""}<br><br>

<b>👤 Customer:</b>
${d.customer_name || ""}<br><br>

<b>📞 Mobile:</b>
${d.customer_mobile || ""}<br><br>

<b>📍 Address:</b>
${d.customer_address || ""}<br><br>

<b>💰 Amount:</b>
₹${d.total_amount || d.order_amount || 0}<br><br>

<b>💳 Payment:</b>
${d.payment_status || ""}<br><br>

<b>🚚 Status:</b>
${d.delivery_status || ""}

</div>
`;

});

document.getElementById("list").innerHTML=html;

}catch(error){

document.getElementById("list").innerHTML =
"❌ "+error.message;

}

}


async function saveDelivery(){

try{

const order =
Number(document.getElementById("order").value)||0;

const received =
Number(document.getElementById("received").value)||0;

const change =
Math.max(received-order,0);

const data={

delivery_boy_name:
document.getElementById("boy").value,

customer_name:
document.getElementById("customer").value,

customer_mobile:
document.getElementById("mobile").value,

customer_address:
document.getElementById("address").value,

order_amount:order,

received_amount:received,

change_amount:change,

total_amount:order,

payment_status:
document.getElementById("payment").value,

delivery_status:
document.getElementById("status").value,

delivery_date:
new Date().toISOString()

};

const response=await fetch(
SUPABASE_URL+"/rest/v1/deliveries",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=representation"
},

body:JSON.stringify(data)

}
);

const result=await response.json();

if(!response.ok){

alert("❌ "+JSON.stringify(result));

return;
}

alert("✅ Delivery Saved");

loadDeliveries();

}catch(error){

alert("❌ "+error.message);

}

}


loadDeliveries();

</script>

</body>
</html>

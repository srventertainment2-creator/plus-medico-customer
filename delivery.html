<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plus Medico Delivery</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1769AA">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f2f5f9;color:#222}
header{background:#1769aa;color:#fff;padding:18px;text-align:center}
header h1{margin:0;font-size:24px}
.container{max-width:1000px;margin:auto;padding:15px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#fff;padding:15px;border-radius:10px;text-align:center;box-shadow:0 2px 8px #ddd}
.stat span{display:block;font-size:14px}
.stat b{display:block;font-size:21px;margin-top:5px}

.card,.summary{background:#fff;padding:18px;border-radius:12px;margin:15px 0;box-shadow:0 2px 8px #ddd}

.summaryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summaryItem{background:#f5f7fa;padding:12px;border-radius:8px;text-align:center}
.summaryItem b{display:block;font-size:18px;margin-top:5px}

.filterGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

label{display:block;font-weight:bold;margin-top:10px}
input,textarea,select{
width:100%;padding:12px;margin-top:5px;
border:1px solid #ccc;border-radius:8px;font-size:16px;
}
textarea{min-height:80px}

button{border:0;border-radius:8px;padding:12px 15px;cursor:pointer;font-size:15px}

.save{width:100%;margin-top:15px;background:#1769aa;color:white;font-size:17px}
.reset{background:#6c757d;color:white}
.today{background:#1769aa;color:white}
.yesterday{background:#555;color:white}

.search{margin-bottom:10px}

.changeBox{margin-top:12px;padding:12px;background:#eef7ff;border-radius:8px}
.balanceBox{margin-top:8px;padding:12px;background:#fff3cd;border-radius:8px}

.delivery{border-top:1px solid #ddd;padding:15px 0}
.delivery:first-child{border-top:0}
.delivery h3{margin-top:0}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.call{background:#25d366;color:white}
.map{background:#4285f4;color:white}
.done{background:#198754;color:white}
.collect{background:#ff9800;color:white}
.delete{background:#dc3545;color:white}

.badge{display:inline-block;padding:5px 8px;border-radius:6px;background:#eee;font-size:13px}
.paid{background:#d1e7dd;color:#0f5132}
.unpaid{background:#fff3cd;color:#664d03}
.credit{background:#e2d9f3;color:#432874}

.error{color:red;background:#ffe5e5;padding:12px;border-radius:8px}
.empty{text-align:center;padding:20px;color:#666}

@media(max-width:600px){
.filterGrid{grid-template-columns:1fr}
.summaryGrid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>🚚 Plus Medico Delivery</h1>
</header>

<div class="container">

<!-- DASHBOARD -->

<div class="stats">

<div class="stat">
<span>

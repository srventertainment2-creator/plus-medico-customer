<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plus Medico Delivery</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f2f5f9;
color:#222;
}

header{
background:#1769aa;
color:white;
padding:18px;
text-align:center;
}

header h1{
margin:0;
font-size:24px;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-bottom:15px;
}

.stat{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 8px #ddd;
}

.stat span{
display:block;
font-size:14px;
}

.stat b{
display:block;
font-size:22px;
margin-top:5px;
}

.card{
background:white;
padding:18px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px #ddd;
}

label{
display:block;
font-weight:bold;
margin-top:10px;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:80px;
}

button{
border:0;
border-radius:8px;
padding:12px 15px;
cursor:pointer;
font-size:15px;
}

.save{
width:100%;
margin-top:15px;
background:#1769aa;
color:white;
font-size:17px;
}

.changeBox{
margin-top:12px;
padding:12px;
background:#eef7ff;
border-radius:8px;
}

.balanceBox{
margin-top:8px;
padding:12px;
background:#fff3cd;
border-radius:8px;
}

.search{
margin-bottom:15px;
}

.delivery{
border-top:1px solid #ddd;
padding:15px 0;
}

.delivery h3{
margin-top:0;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}

.call{
background:#25d366;
color:white;
}

.map{
background:#4285f4;
color:white;
}

.done{
background:#198754;
color:white;
}

.delete{
background:#dc3545;
color:white;
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:6px;
font-size:13px;
background:#eee;
}

</style>
</head>

<body>

<header>
<h1>🚚 Plus Medico Delivery</h1>
</header>

<div class="container">

<!-- DASHBOARD -->

<div class="stats">

<div class="stat">
<span>📦 Total Deliveries</span>
<b id="count">0</b>
</div>

<div class="stat">
<span>💰 Total Amount</span>
<b id="total">₹0</b>
</div>

<div class="stat">
<span>✅ Paid</span>
<b id="paid">₹0</b>
</div>

<div class="stat">
<span>⚠️ Unpaid</span>
<b id="unpaid">₹0</b>
</div>

</div>


<!-- NEW DELIVERY -->

<div class="card">

<h2>➕ New Delivery</h2>

<label>Delivery Boy Name</label>
<input
id="boy"
placeholder="Delivery boy name"
>

<label>Customer Name</label>
<input
id="customer"
placeholder="Customer name"
>

<label>Customer Mobile</label>
<input
id="mobile"
type="tel"
placeholder="Mobile number"
>

<label>Customer Address</label>
<textarea
id="address"
placeholder="Customer address"
></textarea>

<label>Order Amount</label>
<input
id="order"
type="number"
placeholder="₹ Order amount"
oninput="calculateMoney()"
>

<label>Customer Se Received Amount</label>
<input
id="received"
type="number"
placeholder="₹ Received amount"
oninput="calculateMoney()"
>

<div class="changeBox">

🔄 Change to Give:

<b id="change">₹0</b>

</div>

<div class="balanceBox">

⚠️ Balance / Unpaid:

<b id="balance">₹0</b>

</div>


<label>Payment</label>

<select id="payment">

<option value="Unpaid">
Unpaid
</option>

<option value="Paid">
Paid
</option>

</select>


<label>Delivery Status</label>

<select id="status">

<option value="Pending">
Pending
</option>

<option value="Out for Delivery">
Out for Delivery
</option>

<option value="Delivered">
Delivered
</option>

<option value="Cancelled">
Cancelled
</option>

</select>


<button
class="save"
onclick="saveDelivery()"
>

💾 Save Delivery

</button>

</div>


<!-- DELIVERY LIST -->

<div class="card">

<h2>📦 Delivery List</h2>

<input
class="search"
id="search"
placeholder="🔎 Search customer / delivery boy / mobile"
oninput="showDeliveries()"
>

<div id="list">
Loading...
</div>

</div>

</div>


<script>


/* SUPABASE */

const SUPABASE_URL =
"https://rnqxgovsabngikhvbeal.supabase.co";

const SUPABASE_KEY =
"sb_publishable_a8jbA7w9mCgHhM_6Q_bCRQ_CXUss_5b";


let deliveries=[];


/* API */

async function api(endpoint,options={}){

const response=await fetch(

SUPABASE_URL+
"/rest/v1/"+
endpoint,

{
...options,

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+SUPABASE_KEY,

"Content-Type":
"application/json",

"Prefer":
"return=representation",

...(options.headers||{})

}

}

);

const text=
await response.text();

if(!response.ok){

throw new Error(text);

}

return text?
JSON.parse(text):
[];

}


/* MONEY CALCULATION */

function calculateMoney(){

const order=
Number(
document.getElementById("order").value
)||0;

const received=
Number(
document.getElementById("received").value
)||0;


/* CUSTOMER GAVE MORE */

const change=
Math.max(received-order,0);


/* CUSTOMER GAVE LESS */

const balance=
Math.max(order-received,0);


document.getElementById("change")
.innerText=
"₹"+change.toFixed(2);


document.getElementById("balance")
.innerText=
"₹"+balance.toFixed(2);

}


/* SAVE DELIVERY */

async function saveDelivery(){

try{

const boy=
document.getElementById("boy")
.value.trim();

const customer=
document.getElementById("customer")
.value.trim();

const mobile=
document.getElementById("mobile")
.value.trim();

const address=
document.getElementById("address")
.value.trim();

const order=
Number(
document.getElementById("order").value
)||0;

const received=
Number(
document.getElementById("received").value
)||0;


const change=
Math.max(received-order,0);

const balance=
Math.max(order-received,0);


let payment=
document.getElementById("payment")
.value;


/* AUTOMATIC PAYMENT STATUS */

if(balance>0){

payment="Unpaid";

}

else if(received>=order){

payment="Paid";

}


const status=
document.getElementById("status")
.value;


if(!boy){

alert("Delivery Boy Name bharein");

return;

}

if(!customer){

alert("Customer Name bharein");

return;

}

if(!address){

alert("Customer Address bharein");

return;

}

if(order<=0){

alert("Order Amount bharein");

return;

}


const data={

delivery_boy_name:boy,

customer_name:customer,

customer_mobile:mobile,

customer_address:address,

order_amount:order,

received_amount:received,

change_amount:change,

total_amount:order,

payment_status:payment,

delivery_status:status,

delivery_date:
new Date().toISOString()

};


await api(
"deliveries",
{
method:"POST",

body:
JSON.stringify(data)

}
);


alert(
"✅ Delivery Saved Successfully"
);


/* CLEAR FORM */

document.getElementById("boy").value="";

document.getElementById("customer").value="";

document.getElementById("mobile").value="";

document.getElementById("address").value="";

document.getElementById("order").value="";

document.getElementById("received").value="";

document.getElementById("change")
.innerText="₹0";

document.getElementById("balance")
.innerText="₹0";


await loadDeliveries();


}
catch(error){

alert(
"❌ Error: "+
error.message
);

console.error(error);

}

}


/* LOAD */

async function loadDeliveries(){

try{

const data=
await api(
"deliveries?select=*&order=delivery_date.desc"
);

deliveries=data;

showDeliveries();

}
catch(error){

document.getElementById("list")
.innerHTML=
"<p style='color:red'>❌ "+
safe(error.message)+
"</p>";

}

}


/* SHOW */

function showDeliveries(){

const search=
(document.getElementById("search")
.value||"")
.toLowerCase()
.trim();


const filtered=
deliveries.filter(function(d){

return(

String(d.customer_name||"")
.toLowerCase()
.includes(search)

||

String(d.delivery_boy_name||"")
.toLowerCase()
.includes(search)

||

String(d.customer_mobile||"")
.toLowerCase()
.includes(search)

);

});


let total=0;
let paid=0;
let unpaid=0;


filtered.forEach(function(d){

const amount=
Number(d.total_amount||
d.order_amount||
0);

total+=amount;


if(d.payment_status==="Paid"){

paid+=amount;

}
else{

unpaid+=amount;

}

});


document.getElementById("count")
.innerText=
filtered.length;

document.getElementById("total")
.innerText=
"₹"+total.toFixed(2);

document.getElementById("paid")
.innerText=
"₹"+paid.toFixed(2);

document.getElementById("unpaid")
.innerText=
"₹"+unpaid.toFixed(2);


if(filtered.length===0){

document.getElementById("list")
.innerHTML=
"<p>No deliveries found.</p>";

return;

}


let html="";


filtered.forEach(function(d){

const amount=
Number(
d.total_amount||
d.order_amount||
0
);

const received=
Number(
d.received_amount||
0
);

const change=
Number(
d.change_amount||
0
);

const balance=
Math.max(
amount-received,
0
);


html+=`

<div class="delivery">

<h3>
👤 ${safe(d.customer_name)}
</h3>

<p>
👨‍✈️ Delivery Boy:
<b>${safe(d.delivery_boy_name)}</b>
</p>

<p>
📞 ${safe(d.customer_mobile||"-")}
</p>

<p>
📍 ${safe(d.customer_address)}
</p>

<p>
💰 Order Amount:
<b>₹${amount.toFixed(2)}</b>
</p>

<p>
💵 Received:
<b>₹${received.toFixed(2)}</b>
</p>

<p>
🔄 Change:
<b>₹${change.toFixed(2)}</b>
</p>

<p>
⚠️ Balance:
<b>₹${balance.toFixed(2)}</b>
</p>

<p>
💳 Payment:
<span class="badge">
${safe(d.payment_status)}
</span>
</p>

<p>
🚚 Status:
<span class="badge">
${safe(d.delivery_status)}
</span>
</p>


<div class="actions">


${
d.customer_mobile
?
`

<button
class="call"
onclick="callCustomer('${attr(d.customer_mobile)}')"
>
📞 Call
</button>

`
:
""
}


<button
class="map"
onclick="openMap('${attr(d.customer_address)}')"
>
📍 Map
</button>


${
d.delivery_status!=="Delivered"
?
`

<button
class="done"
onclick="markDelivered('${attr(d.id)}')"
>
✅ Delivered
</button>

`
:
""
}


<button
class="delete"
onclick="deleteDelivery('${attr(d.id)}')"
>
🗑 Delete
</button>


</div>

</div>

`;

});


document.getElementById("list")
.innerHTML=html;

}


/* DELIVERED */

async function markDelivered(id){

try{

await api(

"deliveries?id=eq."+encodeURIComponent(id),

{
method:"PATCH",

body:
JSON.stringify({

delivery_status:
"Delivered"

})

}

);

alert(
"✅ Delivery marked as Delivered"
);

await loadDeliveries();

}
catch(error){

alert(
"❌ "+error.message
);

}

}


/* DELETE */

async function deleteDelivery(id){

if(
!confirm(
"Are you sure you want to delete this delivery?"
)
){

return;

}


try{

await api(

"deliveries?id=eq."+
encodeURIComponent(id),

{
method:"DELETE"
}

);

await loadDeliveries();

}
catch(error){

alert(
"❌ "+error.message
);

}

}


/* CALL */

function callCustomer(number){

window.location.href=
"tel:"+number;

}


/* GOOGLE MAP */

function openMap(address){

window.open(

"https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(address),

"_blank"

);

}


/* SECURITY */

function safe(value){

return String(value||"")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function attr(value){

return String(value||"")

.replace(/\\/g,"\\\\")

.replace(/'/g,"\\'");

}


/* START */

loadDeliveries();

</script>

</body>
</html>
